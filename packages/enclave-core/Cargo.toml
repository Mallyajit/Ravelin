[package]
name = "ravelin-wall-enclave"
version = "1.4.2"
edition = "2021"
description = "EVM-Native Stateful Verification Enclave for Robinhood Chain (Chain ID: 4663)"

[dependencies]
sha3 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rocksdb = "0.21"
secp256k1 = { version = "0.28", features = ["recovery", "rand-std"] }
tokio = { version = "1.36", features = ["full"] }
